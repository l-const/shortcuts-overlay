# Shortcuts Overlay Configuration File
#
# This is an example configuration file. To use it, copy it to:
# ~/.config/shortcuts-overlay/overlay-config.toml
#
# Example:
#   mkdir -p ~/.config/shortcuts-overlay
#   cp overlay-config.toml ~/.config/shortcuts-overlay/overlay-config.toml

# Background color in hex format (RGB)
# Default: "#000000" (black)
# Example frosted glass dark: "#32373C"
background_color = "#32373C"

# Text color in hex format (RGB)
# Default: "#ffffff" (white)
text_color = "#ffffff"

# Font size in pixels
# Default: 12.0
# Recommended range: 10-13
font_size = 13.0

## Line height multiply in pixels
## Default: 1.7
### Recommended range: 1.5-3.0
line_height = 1.7

# Enable/disable blur effect for frosted glass appearance
# Default: false
apply-blur = false

# Overlay anchor position
# Default: "center"
# Options: "center", "topleft", "topright", "bottomleft", "bottomright",
#          "top", "bottom", "left", "right"
anchor = "center"

# Overlay width in pixels
# Default: 1200
width = 1200

# Overlay height in pixels
# Default: 800
height = 800

# Corner radius in pixels for rounded corners
# Default: 16.0
# Set to 0 (or omit this line) for square corners without clipping
# When set to 0 or omitted, no clipping mask is created (more efficient)
# Recommended range: 0-32
corner_radius = 32.0
